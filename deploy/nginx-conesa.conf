# nginx adelante de la tienda: atiende el puerto 80 y le pasa todo a Next.js,
# que escucha solo en localhost. Despues certbot agrega el HTTPS aca mismo.

server {
    listen 80;
    listen [::]:80;
    server_name conesa.com.ar www.conesa.com.ar;

    # Las fotos de productos pueden pesar varios MB (el limite de la
    # aplicacion es 16 MB). El default de nginx es 1 MB y cortaria la subida.
    client_max_body_size 20m;

    # Los archivos compilados nunca cambian de contenido: que el navegador se
    # los quede. En esta VM el trafico de salida gratis es poco, asi que cada
    # pedido que no se repite es plata.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Las fotos de los productos salen de la base; cambian solo cuando se
    # editan, asi que un dia de cache del lado del navegador alcanza.
    location /api/productos/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
