# Mira la tienda cada 10 minutos y avisa si algo anda mal.
#
# POR QUE
# Hasta ahora, la unica forma de enterarse de que la tienda estaba caida era
# que un cliente escribiera por WhatsApp. El 31/10 estuvo abajo un rato por
# una migracion rota y nadie se entero hasta que Damian entro a mirar.
#
# COMO AVISA
# Si algo falla, este trabajo falla, y GitHub manda un mail solo a la cuenta
# duena del repositorio. No hace falta configurar nada ni guardar ninguna
# clave: es el mismo mail que ya llega cuando una publicacion sale mal.
# Tambien queda la marca roja en la pestana Actions.
#
# QUE MIRA
# No alcanza con que el servidor conteste: puede contestar y tener el
# catalogo vacio, o los precios en cero. Por eso mira cosas que solo estan
# bien si la tienda de verdad funciona.
#
# POR QUE REINTENTA
# Una publicacion reinicia el programa unos segundos. Sin reintentos, cada
# publicacion mandaria un mail de alarma y en una semana nadie los leeria.

name: Vigilar

on:
  schedule:
    # Cada 10 minutos. GitHub no garantiza el horario exacto y a veces se
    # atrasa unos minutos; para esto alcanza.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: vigilar
  cancel-in-progress: true

jobs:
  mirar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: La tienda esta sana
        env:
          # Desde el 17/11/2026 todo vive en tienda.conesa.com.ar: conesa.com.ar
          # y los subdominios redirigen ahi (301). Apuntando a conesa.com.ar
          # la portada daba "FALLA" siempre (contestaba la redireccion) y la
          # tienda parecia cerrada, asi que el catalogo y el carrito no se
          # revisaban. Antes esto apuntaba al subdominio de Traslasierra, que
          # al cerrar su tienda empezo a redirigir.
          SITIO: https://tienda.conesa.com.ar
          # La tienda que vende. Si esta cerrada no es una falla: se dice y
          # se saltean las pruebas que solo tienen sentido con ella abierta.
          TIENDA: https://tienda.conesa.com.ar
        run: |
          set -u

          # Una prueba: nombre, y un comando que tiene que terminar bien.
          problemas=""

          revisar() {
            local nombre="$1"; shift
            if "$@" >/dev/null 2>&1; then
              echo "  ok    $nombre"
            else
              echo "  FALLA $nombre"
              problemas="$problemas - $nombre"$'\n'
            fi
          }

          contesta() {
            local url="$1" esperado="${2:-200}"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$url")
            [ "$code" = "$esperado" ]
          }

          # El ingreso al panel. V.0.11.252: con Cloudflare Access delante de
          # /admin (Damian, 24/11/2026, seguridad), sin el codigo del mail
          # Cloudflare contesta con un desvio a su pagina de ingreso. Eso
          # tambien es "anda": el que vigila no tiene mail. Que el servidor
          # este vivo lo dice igual la portada.
          panel_vivo() {
            local out code destino
            out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --max-time 25 "$SITIO/admin/login")
            code=${out%% *}; destino=${out#* }
            [ "$code" = "200" ] && return 0
            case "$code" in
              301|302|303|307) [[ "$destino" == *cloudflareaccess.com* ]] && return 0 ;;
            esac
            return 1
          }

          # El catalogo tiene productos de verdad. Si esto falla con el resto
          # en verde, la tienda esta andando pero no tiene nada para vender:
          # pasa si una importacion sale mal.
          hay_productos() {
            local n
            n=$(curl -s --max-time 30 "$TIENDA/tienda?porPagina=500" \
                | grep -o 'itemId' | wc -l)
            [ "$n" -ge 40 ]
          }

          # Si en la tienda se puede comprar ahora mismo.
          #
          # Una tienda cerrada contesta una redireccion a la portada, que es
          # exactamente lo que tiene que hacer. Confundir eso con una caida
          # hacia sonar la alarma cada diez minutos sin que pasara nada.
          tienda_abierta() {
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 \
                   "$TIENDA/tienda")
            [ "$code" = "200" ]
          }

          # Los precios no estan en cero ni rotos.
          precios_sanos() {
            curl -s --max-time 30 "$SITIO/api/financiacion" \
              | grep -q '"dctoContadoPct":[1-9]'
          }

          intento=1
          while [ $intento -le 3 ]; do
            problemas=""
            echo "== intento $intento =="
            # Esto tiene que andar siempre, haya o no una tienda abierta.
            revisar "la portada"            contesta "$SITIO/"
            revisar "los precios"           precios_sanos
            revisar "el panel"              panel_vivo

            # Y esto solo si hay donde comprar. Con todas las tiendas
            # cerradas el sitio sigue sano: muestra los locales y manda a
            # WhatsApp. No es una falla y no tiene que despertar a nadie.
            if tienda_abierta; then
              revisar "el carrito"                  contesta "$TIENDA/tienda/carrito"
              revisar "el catalogo tiene productos" hay_productos
            else
              echo "  --    la tienda esta cerrada; no se revisa el catalogo"
            fi

            [ -z "$problemas" ] && { echo; echo "Todo bien."; exit 0; }

            # Puede ser una publicacion en curso: se reintenta antes de
            # molestar a nadie.
            if [ $intento -lt 3 ]; then
              echo "  (reintento en 30s por si es una publicacion)"
              sleep 30
            fi
            intento=$((intento + 1))
          done

          echo
          echo "=============================================="
          echo "LA TIENDA TIENE UN PROBLEMA"
          echo "=============================================="
          echo
          echo "Falla despues de 3 intentos en un minuto:"
          echo
          printf '%s' "$problemas"
          echo
          echo "Que hacer:"
          echo "  1. Abrir $SITIO y ver que pasa."
          echo "  2. Si no abre, mirar el registro del servidor:"
          echo "     gcloud compute ssh conesa --zone us-central1-a \\"
          echo "       --command 'journalctl -t conesa -n 50'"
          echo "  3. Casi siempre alcanza con volver a publicar:"
          echo "     la pestana Actions -> Publicar -> Run workflow."
          exit 1

      # El chequeo de todos los dias (src/lib/chequeo-diario.ts): productos
      # pausados, sin stock o con poco, y las cuotas de Mercado Pago, para la
      # leyenda de novedades del panel. La tienda no hace nada si ya corrio en
      # las ultimas 20 horas, asi que llamarlo cada 10 minutos no cuesta nada.
      # Nunca hace fallar al vigia.
      - name: Chequeo diario
        if: always()
        run: curl -s -m 90 -X POST https://tienda.conesa.com.ar/api/chequeo-diario || true

      # 26/11/2026: el disco del servidor llego al 100 %, Postgres se detuvo y
      # la tienda dio error 500. Damian: "siempre avisame antes cuando esta
      # quedando poco espacio porque no podemos parar la produccion". Cada 10
      # minutos se mira el disco y la base. Desde el 85 % (o con la base
      # caida) el vigia falla, y GitHub manda el mail de aviso. Punto ademas
      # le muestra una franja a gerencia desde el 80 % (src/lib/disco.ts).
      - name: Lugar en el disco y la base
        if: always()
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ vars.VM_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! salida=$(ssh -o BatchMode=yes -o ConnectTimeout=25 "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" \
              'df -P / | tail -1; df -h / | tail -1; if pg_isready -q; then echo BASE_OK; else echo BASE_MAL; fi'); then
            echo "No pude entrar al servidor para mirar el disco (si la tienda anda, no es grave)."
            exit 0
          fi
          pct=$(printf '%s\n' "$salida" | sed -n 1p | awk '{print $5}' | tr -d '%')
          lugar=$(printf '%s\n' "$salida" | sed -n 2p | awk '{print $4" libres de "$2}')
          base=$(printf '%s\n' "$salida" | sed -n 3p)
          echo "Disco del servidor: ${pct}% usado (${lugar}). Base: ${base}."
          mal=""
          if [ "${pct:-0}" -ge 85 ]; then
            mal="${mal}- EL DISCO DEL SERVIDOR ESTA AL ${pct}% (${lugar}). Si llega al 100 % la base se detiene y se frena todo."$'\n'
          fi
          if [ "$base" != "BASE_OK" ]; then
            mal="${mal}- LA BASE DE DATOS NO ESTA ANDANDO."$'\n'
          fi
          if [ -n "$mal" ]; then
            echo
            echo "=============================================="
            echo "EL SERVIDOR NECESITA ATENCION"
            echo "=============================================="
            printf '%s' "$mal"
            echo
            echo "Que hacer:"
            echo "  1. Volver a publicar (Actions -> Publicar -> Run workflow): antes de"
            echo "     compilar borra las copias de la base que ya estan en Google y,"
            echo "     si la base esta caida, la levanta (deploy/limpiar-disco.sh)."
            echo "  2. Si sigue lleno, agrandar el disco en Google Cloud (Compute Engine"
            echo "     -> Discos -> conesa -> Editar) y volver a publicar."
            exit 1
          fi
